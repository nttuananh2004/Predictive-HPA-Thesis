apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        # Define resource requests/limits so HPA can calculate CPU usage percentage
        resources:
          requests:
            cpu: "100m"  # 100 millicores - The base value HPA uses for calculations
          limits:
            cpu: "500m"  # Max CPU allowed for this pod
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80