apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-leader-election
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-leader-election
  namespace: default
subjects:
- kind: ServiceAccount
  name: datadog-cluster-agent
  namespace: default
roleRef:
  kind: Role
  name: datadog-leader-election
  apiGroup: rbac.authorization.k8s.io